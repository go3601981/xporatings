<app-logo />

<main class="w-full h-screen bg-[#F8FAFC] overflow-hidden relative pb-20">
  
  <!-- Slide Container -->
  @switch (presentation.currentSlideIndex()) {
    @case (0) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-title />
      </div>
    }
    @case (1) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-importance />
      </div>
    }
    @case (2) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-mental-model />
      </div>
    }
    @case (3) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-ux-philosophy />
      </div>
    }
    @case (4) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-feature-definition />
      </div>
    }
    @case (5) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-platform-constraints />
      </div>
    }
    @case (6) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-triggers />
      </div>
    }
    @case (7) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-avoid-triggers />
      </div>
    }
    @case (8) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-suppression-logic />
      </div>
    }
    @case (9) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-user-flow />
      </div>
    }
    @case (10) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-positive-sentiment />
      </div>
    }
    @case (11) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-negative-sentiment />
      </div>
    }
    @case (12) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-pre-prompt-modal />
      </div>
    }
    @case (13) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-edge-cases />
      </div>
    }
    @case (14) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-success-metrics />
      </div>
    }
    @case (15) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-final-recommendation />
      </div>
    }
    @case (16) {
      <div class="w-full h-full animate-fade-in">
        <app-slide-next-steps />
      </div>
    }
  }

</main>

<app-nav-bar />

<style>
  .animate-fade-in {
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
